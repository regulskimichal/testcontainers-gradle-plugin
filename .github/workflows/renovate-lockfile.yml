name: Update Renovate Locks

on:
  pull_request:
    paths:
      - 'gradle/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: write

jobs:
  update-locks:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17.0.20+101'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Update Gradle Locks
        run: |
          chmod +x gradlew
          ./gradlew dependencies --write-locks

      - name: Commit & Push Lockfile Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet *.lockfile; then
            git add *.lockfile
            git commit -m "chore(deps): update dependency locks"
            git push origin HEAD:${{ github.head_ref }}
          fi
