name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token (for Renovate PRs)
        if: startsWith(github.head_ref, 'renovate/')
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17.0.20+101'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Update Lockfiles (Renovate only)
        id: lockfile_update
        if: startsWith(github.head_ref, 'renovate/')
        run: |
          chmod +x gradlew
          ./gradlew dependencies --write-locks
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet *.lockfile; then
            git add *.lockfile
            git commit -m "chore(deps): update dependency locks"
            git push origin HEAD:${{ github.head_ref }}
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Gradle
        if: steps.lockfile_update.outputs.pushed != 'true'
        run: |
          chmod +x gradlew
          ./gradlew check
